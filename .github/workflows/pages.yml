name: Deploy GitHub Pages

# Trigger GitHub Pages deployment after enabling Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /EGSplat
      NEXT_PUBLIC_SITE_URL: https://tanveeryounis.github.io/EGSplat
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Optimize comparison videos for web playback
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          find public/videos -type f -name '*.mp4' -print0 | while IFS= read -r -d '' file; do
            tmp="${file%.mp4}.faststart.mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map 0:v:0 -c:v copy -an -movflags +faststart \
              "$tmp"
            mv "$tmp" "$file"
          done

      - name: Build static site
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
